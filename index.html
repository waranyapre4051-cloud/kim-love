
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถึงคิม 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: sans-serif;
  background: linear-gradient(135deg, #ffe4ee, #fbd5ff, #fff0f6);
}

.card {
  width: 88%;
  max-width: 380px;
  padding: 30px 20px;
  text-align: center;
  background: rgba(255,255,255,0.9);
  border-radius: 30px;
  box-shadow: 0 10px 35px #e8a9c566;
  z-index: 2;
}

.heart {
  font-size: 75px;
  animation: beat 1s infinite;
}

h1 {
  color: #ff69a6;
}

h2 {
  color: #ff75ad;
}

p {
  color: #a15d7c;
  font-size: 18px;
}

button {
  border: none;
  padding: 14px 20px;
  border-radius: 30px;
  font-size: 16px;
  margin: 7px;
  cursor: pointer;
}

.yes {
  background: #ff75ad;
  color: white;
}

.no {
  background: #ffe3ef;
  color: #d65d91;
}

#message {
  margin-top: 20px;
  font-size: 19px;
  color: #ff5d9e;
  line-height: 1.7;
}

.floating {
  position: fixed;
  bottom: -30px;
  animation: float 6s linear infinite;
  pointer-events: none;
}

@keyframes beat {
  50% { transform: scale(1.2); }
}

@keyframes float {
  from { transform: translateY(0); opacity: 0.8; }
  to { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="card">
  <div class="heart">💗</div>

  <h1>ถึงคิม 💌</h1>
  <p>คิมมีอะไรจะบอก...</p>

  <h2>เป็นแฟนกันไหม? 🥺💕</h2>

  <button class="yes" onclick="yes()">ตกลง 💖</button>
  <button class="no" onclick="no()">ขอคิดดูก่อน 🙈</button>

  <div id="message"></div>
</div>

<script>
function yes() {
  document.getElementById("message").innerHTML =
    "เย้ 💗 ขอบคุณที่ตอบนะ! แคปหน้าจอนี้ส่งกลับมาให้คนทำเว็บด้วยนะ 📸💕";
}

function no() {
  document.getElementById("message").innerHTML =
    "ไม่เป็นไรเลยนะ 😊 ค่อย ๆ คิดได้ ขอบคุณที่ตอบนะ 💗";
}

for (let i = 0; i < 25; i++) {
  let h = document.createElement("div");
  h.className = "floating";
  h.innerHTML = ["💗","💕","🌸","💖"][Math.floor(Math.random()*4)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = (3 + Math.random() * 5) + "s";
  h.style.fontSize = (15 + Math.random() * 25) + "px";
  document.body.appendChild(h);
}
</script>

</body>
</html>
